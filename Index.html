<script>
  // --- Polyfill de window.storage usando localStorage del navegador ---
  // Reproduce la API get/set/delete/list que usan los artifacts de Claude,
  // así la app funciona igual pero guardando los datos localmente en Chrome.
  (function () {
    var PREFIX = "control-tienda::";

    // Algunos navegadores bloquean el almacenamiento (modo privado, Safari con
    // archivos locales). En ese caso se usa memoria: la app funciona igual
    // durante la sesión, pero avisamos que los datos no se van a guardar.
    var almacen = null;
    try {
      window.localStorage.setItem(PREFIX + "__test", "1");
      window.localStorage.removeItem(PREFIX + "__test");
      almacen = window.localStorage;
    } catch (e) {
      var memoria = {};
      almacen = {
        getItem: function (k) { return Object.prototype.hasOwnProperty.call(memoria, k) ? memoria[k] : null; },
        setItem: function (k, v) { memoria[k] = String(v); },
        removeItem: function (k) { delete memoria[k]; },
        key: function (i) { return Object.keys(memoria)[i]; },
        get length() { return Object.keys(memoria).length; }
      };
      window.addEventListener("DOMContentLoaded", function () {
        var aviso = document.createElement("div");
        aviso.textContent = "Este navegador no permite guardar datos en el dispositivo. Podés probar la app, pero lo que cargues se pierde al cerrar la pestaña.";
        aviso.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#B3261E;color:#fff;font:500 13px/1.5 system-ui,sans-serif;padding:11px 18px;text-align:center";
        document.body.appendChild(aviso);
        setTimeout(function () { aviso.remove(); }, 9000);
      });
    }

    window.storage = {
      get: function (key, shared) {
        return Promise.resolve().then(function () {
          var raw = almacen.getItem(PREFIX + key);
          if (raw === null) throw new Error("Key not found: " + key);
          return { key: key, value: raw, shared: !!shared };
        });
      },
      set: function (key, value, shared) {
        return Promise.resolve().then(function () {
          almacen.setItem(PREFIX + key, value);
          return { key: key, value: value, shared: !!shared };
        });
      },
      delete: function (key, shared) {
        return Promise.resolve().then(function () {
          almacen.removeItem(PREFIX + key);
          return { key: key, deleted: true, shared: !!shared };
        });
      },
      list: function (prefix, shared) {
        return Promise.resolve().then(function () {
          var todas = [];
          for (var i = 0; i < almacen.length; i++) todas.push(almacen.key(i));
          var keys = todas
            .filter(function (k) { return k && k.indexOf(PREFIX) === 0; })
            .map(function (k) { return k.slice(PREFIX.length); })
            .filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
          return { keys: keys, prefix: prefix, shared: !!shared };
        });
      }
    };

    window.addEventListener("error", function (e) {
      var el = document.getElementById("boot-error");
      el.style.display = "block";
      el.textContent = "Ocurrió un error cargando la app:\n\n" + (e.error ? (e.error.stack || e.error.message) : e.message);
    });
  })();
</script>

// ===== Caja por usuario =====
// Cada persona abre y cierra su propia caja. El efectivo de una no se mezcla
// con el de otra, y al cerrar cada uno responde por lo suyo.
const CAJA_VACIA = { abierta: false, montoInicial: 0, abiertaEn: null, movimientos: [] };

const usuarioActualId = (data) => {
  const lista = data.usuarios || [];
  // Sólo el que entró con su cuenta. Antes, si no se encontraba, caía en el
  // primero de la lista: como la lista podía venir en otro orden, la clave de
  // la caja cambiaba y parecía que la caja se había reiniciado.
  const u = lista.find((x) => x.esVos);
  if (u) return u.id;
  const suplente = lista.find((x) => x.activo !== false) || lista[0];
  return suplente ? suplente.id : "sin-usuario";
};
const nombreUsuario = (data, id) => {
  const u = (data.usuarios || []).find((x) => x.id === id);
  return u ? u.nombre : "Sin usuario";
};
// Cada negocio tiene su propio efectivo, y dentro de cada uno, cada persona
// lleva su caja. La clave junta las dos cosas.
const claveCaja = (negocioId, usuarioId) => negocioId + "|" + usuarioId;
const cajaDe = (data, usuarioId, negocioId) =>
  (data.cajas || {})[claveCaja(negocioId || negocioActivo(data).id, usuarioId)] || CAJA_VACIA;
const miCaja = (data) => cajaDe(data, usuarioActualId(data), negocioActivo(data).id);
const guardarCaja = (data, usuarioId, caja, negocioId) => ({
  ...data,
  cajas: { ...(data.cajas || {}), [claveCaja(negocioId || negocioActivo(data).id, usuarioId)]: caja }
});
// Cajas abiertas por otras personas en el mismo negocio
// Quién abrió la caja. Las abiertas antes de guardar el dato caen al usuario
// bajo cuya clave están guardadas.
const abrioLaCaja = (data, caja, usuarioId) => {
  if (caja && caja.abiertaPor) return caja.abiertaPor;
  return usuarioId ? nombreUsuario(data, usuarioId) : "";
};

const cajasAbiertasDeOtros = (data) => {
  const mio = usuarioActualId(data);
  const negId = negocioActivo(data).id;
  return Object.keys(data.cajas || {})
    .filter((k) => {
      const [neg, usr] = k.split("|");
      return neg === negId && usr !== mio && (data.cajas[k] || {}).abierta;
    })
    .map((k) => {
      const usuarioId = k.split("|")[1];
      return { usuarioId, nombre: nombreUsuario(data, usuarioId), caja: data.cajas[k] };
    });
};
// Cajas abiertas en los demás negocios, para saber si quedó alguna sin cerrar
const cajasAbiertasEnOtrosNegocios = (data) => {
  const negId = negocioActivo(data).id;
  return Object.keys(data.cajas || {})
    .filter((k) => k.split("|")[0] !== negId && (data.cajas[k] || {}).abierta)
    .map((k) => {
      const [neg, usr] = k.split("|");
      const n = listaNegocios(data).find((x) => x.id === neg);
      return { negocioId: neg, negocioNombre: n ? n.nombre : "Otro negocio", nombre: nombreUsuario(data, usr), caja: data.cajas[k] };
    })
    .filter((x) => listaNegocios(data).some((n) => n.id === x.negocioId));
};

// La caja única de las versiones anteriores pasa a ser la del usuario actual
const migrarCajas = (data) => {
  const mio = usuarioActualId(data);
  const principal = listaNegocios(data)[0].id;
  const cajas = {};

  // Las claves sin negocio son de versiones anteriores: van al principal
  Object.keys(data.cajas || {}).forEach((k) => {
    cajas[k.indexOf("|") >= 0 ? k : claveCaja(principal, k)] = data.cajas[k];
  });

  // Y la caja única, más vieja todavía, al usuario actual en el principal
  const vieja = data.caja;
  const clave = claveCaja(principal, mio);
  if (vieja && (vieja.abierta || (vieja.movimientos || []).length) && !cajas[clave]) cajas[clave] = vieja;

  const cierres = (data.cajasCerradas || []).map((c) => ({
    ...c,
    usuarioId: c.usuarioId || mio,
    usuarioNombre: c.usuarioNombre || nombreUsuario(data, c.usuarioId || mio),
    negocioId: c.negocioId || principal
  }));

  const salida = { ...data, cajas, cajasCerradas: cierres };
  delete salida.caja;
  return salida;
};

const efectivoEnCaja = (caja) => {
  if (!caja) return 0;
  const movs = caja.movimientos || [];
  const entra = movs.filter((m) => m.tipo === "ingreso" || m.tipo === "venta").reduce((s, m) => s + m.monto, 0);
  const sale = movs.filter((m) => m.tipo === "retiro" || m.tipo === "devolucion").reduce((s, m) => s + m.monto, 0);
  return (caja.montoInicial || 0) + entra - sale;
};

// ===== Detección de pantalla chica =====
function useIsMobile(bp = 700) {

}

// ===== Respaldo y restauración =====
const BACKUP_VERSION = 1;
const stamp = () => {
  const d = new Date();
  const p2 = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}`;

// ===== MEJORA 1: recordatorio de respaldo =====
// Los datos viven sólo en este navegador: si se borra la caché o se pierde el
// equipo, no hay vuelta atrás. Se guarda la fecha del último respaldo para
// poder avisar cuando pasó demasiado tiempo.
const CLAVE_RESPALDO = "ct-ultimo-respaldo";
const marcarRespaldo = () => {
  try { localStorage.setItem(CLAVE_RESPALDO, todayISO()); } catch (e) {}
};
// ===== MEJORA 4: cuánto espacio queda =====
// El navegador da unos 5 MB. Las fotos de comprobantes son lo que más pesa.
// Conviene avisar antes de que un guardado falle, no después.
const espacioUsado = () => {
  try {
    let bytes = 0;
    for (const k in localStorage) {
      if (Object.prototype.hasOwnProperty.call(localStorage, k)) bytes += (localStorage[k] || "").length;
    }
    return { mb: bytes / 1048576, pct: Math.min(100, Math.round((bytes / 5242880) * 100)) };
  } catch (e) { return null; }
};

const diasSinRespaldo = () => {
  try {
    const f = localStorage.getItem(CLAVE_RESPALDO);
    if (!f) return null;
    return Math.max(0, Math.round((new Date(todayISO()) - new Date(f)) / 86400000));

};

const exportarRespaldo = (data) => {
  const paquete = {
    _app: "control-tienda",

const leerRespaldo = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const contenido = parsed && parsed.data ? parsed.data : parsed;
      if (!contenido || typeof contenido !== "object" || !Array.isArray(contenido.productos)) {
        return reject(new Error("El archivo no parece un respaldo de Control Tienda."));
      }
      resolve({ ...EMPTY, ...contenido });
    } catch (e) {
      reject(new Error("El archivo está dañado o no es un respaldo válido."));
    }
  };
  reader.readAsText(file);
});
const resumenRespaldo = (d) => [
  `${(d.productos || []).length} productos`,
  `${(d.ventas || []).length} ventas`,
  `${(d.clientes || []).length} clientes`,
  `${(d.compras || []).length} compras`
].join(" · ");



// ===== Varios negocios bajo la misma cuenta =====
const COLORES_NEGOCIO = ["#6366F1", "#34D399", "#FBBF24", "#F472B6", "#22D3EE", "#F87171"];

// Devuelve siempre al menos un negocio: el principal, aunque no se haya creado la lista
// Los negocios a los que puede entrar quien está usando la app. El dueño ve
// todos; el resto, sólo aquellos en los que está registrado.
const negociosDelUsuario = (data) => {
  const todos = listaNegocios(data);
  const u = (data.usuarios || []).find((x) => x.esVos);
  if (!u || u.rol === "Propietario") return todos;
  const suyos = u.negocios || [];
  if (!suyos.length) return todos;   // sin asignar todavía: no se lo encierra
  const filtrados = todos.filter((n) => suyos.indexOf(n.id) >= 0);
  return filtrados.length ? filtrados : todos;
};

const listaNegocios = (data) => {
  const guardados = data.negocios || [];
  if (guardados.length) return guardados;
  const nombre = (data.negocio && data.negocio.nombre) || "Mi Tienda";
  return [{ id: "principal", nombre, color: COLORES_NEGOCIO[0], principal: true }];
};
// Código corto y estable, derivado del identificador del negocio
const codigoNegocio = (n) => {
  const base = String((n && (n.id + "|" + n.nombre)) || "");
  let h = 0;
  for (let i = 0; i < base.length; i++) h = (h * 31 + base.charCodeAt(i)) >>> 0;
  return "#" + h.toString(16).slice(0, 4).toUpperCase().padStart(4, "0");
};

const negocioActivo = (data) => {
  // Sólo entre los que esta persona tiene habilitados: si quedó apuntando a
  // uno que no le corresponde, cae en el primero de los suyos.
  const lista = negociosDelUsuario(data);
  return lista.find((n) => n.id === data.negocioActivoId) || lista[0];
};

// Datos del producto para un negocio puntual
const enNegocio = (producto, negocioId) => (producto.porNegocio || {})[negocioId] || null;
const publicadoEn = (producto, negocioId, principalId) => {
  const d = enNegocio(producto, negocioId);
  if (d) return d.activo !== false;
  return negocioId === principalId;
};
const precioEn = (producto, negocio, principalId) => {
  const d = enNegocio(producto, negocio.id);
  if (d && d.precio != null && d.precio !== "") return Number(d.precio);
  return publicadoEn(producto, negocio.id, principalId) ? producto.precioVenta : null;
};
const codigoEn = (producto, negocio, principalId) => {
  const d = enNegocio(producto, negocio.id);
  if (d && d.codigo) return d.codigo;
  return publicadoEn(producto, negocio.id, principalId) ? (producto.codigoBarras || "") : "";
};

// ===== Stock propio de cada negocio =====
// Cada negocio guarda sus unidades y, si el producto viene en talles, su

const stockNegocio = (producto, negocioId) => {
  const d = enNegocio(producto, negocioId);
  return d && d.stock != null && d.stock !== "" ? Number(d.stock) : 0;
};
// Una variante es una combinación de talle y color. El color puede estar
// vacío: un producto puede venir solo por talle, como siempre.
// "2026-08-30" -> "08/26". Sirve para ver de un vistazo qué prenda está vieja
// sin tener que consultar el sistema.
const mesCorto = (iso) => {
  if (!iso) return "";
  const partes = String(iso).slice(0, 10).split("-");
  if (partes.length < 2) return "";
  return partes[1] + "/" + partes[0].slice(2);
};

// Lo que un cliente debe: las ventas fiadas y los cargos, menos los pagos.
// Vive acá porque lo usan la ficha del cliente y el punto de venta.
const saldoDeCliente = (data, clienteId) => {
  if (!clienteId) return 0;
  const ventas = (data.ventas || [])
    .filter((v) => v.clienteId === clienteId && !esDevolucion(v) && v.metodoPago === "cuenta_corriente")
    .reduce((a, v) => a + (v.total || 0), 0);
  const movs = (data.movimientosCC || []).filter((m) => m.clienteId === clienteId);
  const cargos = movs.filter((m) => m.tipo === "cargo").reduce((a, m) => a + (m.monto || 0), 0);
  const pagos = movs.filter((m) => m.tipo !== "cargo").reduce((a, m) => a + (m.monto || 0), 0);
  return Math.max(0, ventas + cargos - pagos);
};

const claveVariante = (v) => String(v.talle || "") + "|" + String(v.color || "");
// De la clave "38|Negro" al texto "Talle 38 · Negro"
const textoDeClave = (clave) => {
  const partes = String(clave || "").split("|");
  return etiquetaVariante({ talle: partes[0], color: partes[1] });
};
const etiquetaVariante = (v) => [v.talle && "Talle " + v.talle, v.color].filter(Boolean).join(" · ");
// Detalle de una línea del ticket con sus rótulos: "Talle 38 · Color Negro".
// Sin los rótulos, un talle "6" y un color "6" se confunden al leer.
// En el cartel de precio el nombre entra en dos renglones: más de tres
// palabras se cortaba a la mitad y quedaba ilegible. Se recorta con puntos
// suspensivos para que se note que sigue.
const nombreCorto = (nombre, tope) => {
  const palabras = String(nombre || "").trim().split(/\s+/).filter(Boolean);
  const max = tope || 3;
  return palabras.length <= max ? palabras.join(" ") : palabras.slice(0, max).join(" ") + "\u2026";
};
const detalleItem = (it, separador) => [
  it.talla && "Talle " + it.talla,
  it.color && "Color " + it.color
].filter(Boolean).join(separador || " \u00B7 ");

// Busca a qué producto y variante pertenece un código escaneado.
// Devuelve null si el código no es de ninguna variante.
const buscarVariantePorCodigo = (productos, negocioId, codigo) => {
  const cod = String(codigo || "").trim();
  if (!cod) return null;
  for (const p of productos || []) {
    const d = (p.porNegocio || {})[negocioId];
    const vs = (d && d.variantes) || [];
    const v = vs.find((x) => String(x.codigo || "").trim() === cod);
    if (v) return { producto: p, variante: v };
  }
  return null;
};

const variantesNegocio = (producto, negocioId) => {
  const d = enNegocio(producto, negocioId);

          box-shadow: 0 0 0 3px color-mix(in srgb, var(--denim) 16%, transparent);
        }
        /* Las tarjetas entran de a poco al abrir una pantalla */
        @keyframes ct-entrar { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

        /* El escalonado sólo entre bloques de la pantalla: dentro de una

        .ct-main > .ct-card:nth-of-type(2) { animation-delay: .05s }
        .ct-main > .ct-card:nth-of-type(3) { animation-delay: .1s }
        .ct-main > .ct-card:nth-of-type(4) { animation-delay: .15s }
        .ct-main > .ct-card:nth-of-type(n+5) { animation-delay: .2s }
        /* Se levantan apenas al apuntarlas */

        @keyframes ct-numero { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }

        /* ===== Movimiento de los gráficos ===== */
        /* Los puntos de la línea laten al aparecer, uno tras otro */

        .ct-punto { animation: ct-punto .4s cubic-bezier(.34,1.56,.64,1) backwards; }
        /* El punto apuntado se agranda y proyecta un halo */
        .ct-svg circle { transition: r .12s ease, filter .12s ease; }
        .ct-svg:hover circle { filter: drop-shadow(0 0 4px currentColor); }
        /* Las barras se iluminan y crecen apenas al apuntarlas */
        @media (hover: hover) and (pointer: fine) {
          .ct-barra-hora:hover, .ct-barra-sem:hover { filter: brightness(1.25); }
        }
        /* La línea del gráfico brilla apenas: da sensación de dato vivo */
        @keyframes ct-brillo { 0%, 100% { filter: none } 50% { filter: drop-shadow(0 0 3px currentColor) } }
        .ct-traza { color: inherit; }
        .ct-traza:hover { filter: drop-shadow(0 0 5px currentColor); }
        /* La leyenda entra desde la izquierda */
        @keyframes ct-leyenda { from { opacity: 0; transform: translateX(-8px) } to { opacity: 1; transform: none } }

        /* El trazo se dibuja de izquierda a derecha al entrar al gráfico */

        @keyframes ct-fundido { from { opacity: 0 } to { opacity: 1 } }
        .ct-traza { stroke-dasharray: 2000; animation: ct-trazar 1.1s cubic-bezier(.22,.61,.36,1) forwards; }
        .ct-traza2 { animation-delay: .12s; }
        .ct-area { opacity: 0; animation: ct-fundido .8s ease .35s forwards; }

        /* ===== Más vida en los gráficos ===== */
        /* La línea deja un brillo que la sigue mientras se dibuja */
        /* Línea limpia, sin halo: en la referencia el color sólido alcanza */
        .ct-traza { stroke-linecap: round; }
        .ct-traza:hover { filter: drop-shadow(0 0 7px currentColor); }

        /* Los puntos de la línea aparecen uno tras otro, ya trazada */
        @keyframes ct-punto { from { r: 0; opacity: 0 } to { opacity: 1 } }

        .ct-punto:hover { filter: drop-shadow(0 0 6px currentColor); }

        /* Las barras rebotan apenas al llegar arriba, en vez de frenar seco */

        @media (hover: hover) and (pointer: fine) {

        /* Las porciones de la dona se dibujan girando desde el centro */

        .ct-area2 { animation-delay: .45s; }

        @keyframes ct-latido { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(0.92); opacity: .72 } }

        /* Modales: crecen apenas en vez de aparecer de golpe */

        /* Dos declaraciones: la segunda solo la aplican los navegadores que

        /* En un modal largo el título se perdía al desplazar: queda fijo arriba

        .ct-velo { animation: ct-velo-in .18s ease both; }
        /* Tilde de venta confirmada: se dibuja solo */
        @keyframes ct-circulo { from { stroke-dashoffset: 166 } to { stroke-dashoffset: 0 } }
        @keyframes ct-tilde { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }

        /* Esqueletos mientras se calculan los reportes */

        .ct-esqueleto { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--hover) 37%, var(--surface-2) 63%);
          background-size: 240% 100%; animation: ct-brillo 1.3s ease-in-out infinite; }
        /* El buscador se enciende cuando el cursor está adentro.
